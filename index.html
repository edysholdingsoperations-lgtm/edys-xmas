<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style id="pageStyle">@page{size:100mm 50mm;margin:0}</style>
<style>
:root{--p:#12719f;--p2:#0e5b80;--pl:#e4f3fb;--ec:#35bfcb;--ed:#239fd8;--ey:#d23593;--es:#e8cf1d;
--g:#166534;--gl:#dcfce7;--r:#b91c1c;--rl:#fee2e2;--a:#b45309;--al:#fef3c7;--b:#1d4ed8;--bl:#dbeafe;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f6f8;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.4}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 10px}
small,.muted{color:var(--mut)}
h2 .muted{font-size:13px;font-weight:400}
a{color:var(--b)}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p);border-color:var(--p)}
label{display:block;font-size:13px;color:#374151;margin:0 0 10px}
label>input,label>select,label>textarea{margin-top:4px}
.chkl{display:flex;gap:10px;align-items:center;font-size:14px}
.chkl input{width:20px;height:20px;margin:0;flex:none}
.inline{display:inline-flex;gap:6px;align-items:center;margin:0}
.inline select{width:auto;margin:0;padding:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 14px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.danger{color:var(--r);border-color:#fca5a5}
.btn.big{min-height:52px;font-size:16px;width:100%;margin-top:6px;font-weight:600}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
body.busy .btn,body.busy button{pointer-events:none;opacity:.55}
#busybar{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--ec),var(--ed),var(--ey),var(--es),var(--ec));background-size:200% 100%;animation:mv 1s linear infinite;display:none;z-index:99}
body.busy #busybar{display:block}
@keyframes mv{to{background-position:-200% 0}}
.logo{font-weight:800;letter-spacing:-1px;line-height:1}
.logo i{font-style:normal}
.logo .e{color:var(--ec)}.logo .d{color:var(--ed)}.logo .y{color:var(--ey)}.logo .s{color:var(--es)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header .logo{font-size:26px}
header .sub{font-size:13px;color:var(--mut);font-weight:600}
header .who{margin-left:auto;font-size:13px;color:var(--mut);text-align:right;line-height:1.2}
header .btn{min-height:36px;padding:5px 10px}
nav{position:sticky;top:51px;z-index:19;display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;padding:9px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;color:#374151}
nav button.on{background:var(--pl);color:var(--p);font-weight:700}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--r);color:#fff;font-size:12px;text-align:center;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:14px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card.narrow{max-width:760px;margin-left:auto;margin-right:auto}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.hrow h2{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.tile[data-go]{cursor:pointer}
.tile .n{font-size:28px;font-weight:800}
.tile .l{font-size:13px;color:var(--mut)}
.tile.warn .n{color:var(--r)}
.alert{background:var(--rl);border:1px solid #fca5a5;color:#7f1d1d;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row:active{background:#f8fafc}
.row.hot{background:#fff5f5}
.row .chk{width:24px;height:24px;margin:0;flex:none}
.row .main{flex:1;min-width:0}
.row .l1 b{color:var(--p)}
.row .l2{font-size:13px;color:#4b5563}
.row .l3{font-size:12px;color:var(--mut)}
.row .tags{display:flex;gap:4px;flex-wrap:wrap}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;margin:0}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#f3f4f6;color:#374151;white-space:nowrap}
.pill.green{background:var(--gl);color:var(--g)}
.pill.red{background:var(--rl);color:var(--r)}
.pill.amber{background:var(--al);color:var(--a)}
.pill.blue{background:var(--bl);color:var(--b)}
.pill.dark{background:#1f2937;color:#fff}
.rel{font-size:12px;color:var(--mut)}
.rel.soon{color:var(--a);font-weight:700}
.rel.late{color:var(--r);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts.sticky{position:sticky;bottom:0;background:#fff;padding:10px 0 4px;border-top:1px solid var(--line);z-index:5}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:0 0 12px}
.opt{display:flex;flex-direction:column;border:1px solid #cbd5e1;border-radius:12px;padding:10px;cursor:pointer;margin:0;position:relative}
.opt input{position:absolute;opacity:0}
.opt:has(input:checked){border-color:var(--p);background:var(--pl);box-shadow:0 0 0 1px var(--p)}
.opt.out{opacity:.55}
.opt .os{font-weight:800;font-size:16px}
.opt .op{font-size:13px}
.opt .oa{font-size:12px;color:var(--mut)}
.sum{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:10px 12px;margin:4px 0 10px;font-size:14px}
.sum .bal{font-size:18px;font-weight:800}
.kvg{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;font-size:14px;margin-bottom:10px}
.kvg dt{color:var(--mut)}
.kvg dd{margin:0;word-break:break-word}
.hi{font-size:13px;padding:5px 0;border-bottom:1px dotted var(--line)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 10px;z-index:50;overflow-y:auto}
#modal .sheet{background:#fff;border-radius:16px;max-width:680px;width:100%;padding:18px;position:relative}
#modal .x{position:absolute;right:6px;top:4px;width:44px;height:44px;border:0;background:transparent;font-size:28px;cursor:pointer;color:var(--mut)}
.radios{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.radios label{display:flex;gap:8px;align-items:center;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;margin:0;font-size:14px;cursor:pointer}
.radios input{width:18px;height:18px;margin:0}
.paybox{background:#f8fafc;border-radius:12px;padding:12px;margin-bottom:12px}
.bigamt{font-size:30px;font-weight:800;color:var(--r)}
.scanrow{display:flex;gap:8px;align-items:stretch}
.scanrow input{flex:1;margin:0}
.scanrow .btn{flex:none;min-width:64px;font-size:22px}
.scan{font-size:18px;padding:13px;border:2px solid var(--p)}
.scan.sm{font-size:16px;padding:10px}
.ccard .chead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cno{font-size:30px;font-weight:800;color:var(--p);letter-spacing:1px}
.cname{font-size:17px;font-weight:700}
.citem{font-size:20px;font-weight:800;margin:8px 0 4px}
.ck{border-radius:12px;padding:12px;margin:10px 0;font-size:16px;font-weight:700}
.ck small{font-weight:400}
.ck.ok{background:var(--gl);color:var(--g)}
.ck.bad{background:var(--rl);color:var(--r)}
.ck.big{font-size:20px;text-align:center}
.hand{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
#sig{width:100%;height:200px;border:2px dashed #94a3b8;border-radius:12px;touch-action:none;background:#fff;display:block}
.siglab{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#374151;margin-bottom:4px}
.why{font-size:13px;color:var(--a);margin-top:8px}
.okc{color:var(--g);font-weight:700;font-size:14px}
.badc{color:var(--r);font-weight:700;font-size:14px}
.done{text-align:center}
.bigok{font-size:64px;color:var(--g)}
.res{margin-top:10px;font-size:16px;font-weight:700}
.loadbars{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;align-items:end;height:100px}
.loadbars div{background:var(--pl);border-radius:4px 4px 0 0;min-height:2px}
.loadbars div.today{background:var(--ed)}
.loadlbl{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;font-size:9px;color:var(--mut);text-align:center;margin-top:4px}
.loadlbl b{display:block;font-size:12px;color:var(--ink)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th,table.st td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.st th{font-size:12px;color:var(--mut);font-weight:600}
table.st input{padding:6px;width:96px}
table.st td.num{text-align:right}
#login{max-width:400px;margin:0 auto;padding:50px 16px 20px}
#login .logo{text-align:center;font-size:64px}
#login h1{text-align:center;font-size:18px;margin:8px 0 18px;color:var(--mut);font-weight:600}
.err{color:var(--r);font-size:14px;min-height:20px}
.ver{font-size:12px;color:var(--mut);text-align:center;margin-top:16px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;max-width:92%;z-index:100;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:center}
#toast.err{background:var(--r)}
#fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;height:62px;padding:0 22px;border:0;border-radius:31px;background:var(--p);color:#fff;font:inherit;font-size:17px;font-weight:700;box-shadow:0 8px 24px rgba(18,113,159,.45);display:flex;align-items:center;gap:8px;cursor:pointer}
#fab .ic{font-size:24px}
#scanner{position:fixed;inset:0;z-index:90;background:#000;color:#fff;display:flex;flex-direction:column}
#scanner .top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
#scanner .vw{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#scVideo{width:100%;height:100%;object-fit:cover}
#scanner .frame{position:absolute;width:64vmin;height:64vmin;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#scanner .bot{padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));text-align:center}
#scStatus{font-size:16px;margin-bottom:12px;min-height:22px}
#scanner .btn{background:#fff;color:#111;border:0}
#scanner .btn.pri{background:var(--p);color:#fff}
#scPhoto{font-size:18px}
#scanner .tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#scanner .tools .btn{min-height:40px;font-size:14px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35)}
#scanner .tools .btn.on{background:#fde047;color:#111}
#scLast{font-size:15px;min-height:20px;margin-bottom:6px}
#scLast .okc{color:#86efac}#scLast .badc{color:#fca5a5}
#scCount{display:inline-block;background:#fff;color:#111;border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px}
#scanner .frame.hit{border-color:#4ade80;box-shadow:0 0 0 2000px rgba(0,80,30,.35)}
#scanner .phoneapp{display:block;margin-top:10px;color:#fde047;font-size:15px}
#srvBox{display:none}
#print{display:none}
@media (max-width:640px){
  .grid2,.grid3{grid-template-columns:1fr}
  main{padding:10px 10px 110px}
  .card{padding:13px;border-radius:12px;margin-bottom:10px}
  header .sub{display:none}
  header .btn .tx{display:none}
  .tiles{grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{padding:10px}
  .tile .n{font-size:22px}
  .tile .l{font-size:11px}
  .row .tags{width:100%}
  .row>.btn,.row .acts{width:100%}
  .row .acts .btn,.row>.btn{flex:1}
  .acts .btn{flex:1 1 auto}
  #modal{padding:0;align-items:stretch}
  #modal .sheet{border-radius:0;min-height:100%;padding:16px 14px 110px}
  .kvg{grid-template-columns:105px 1fr;font-size:13.5px}
  .cno{font-size:26px}
}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block}
  body{background:#fff;margin:0;color:#000}
}
.pg{display:block;width:100mm;height:49.6mm;overflow:hidden;page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid}
.pg:last-child{page-break-after:auto;break-after:auto}
.stk{width:100mm;height:49.6mm;padding:3mm 4mm;box-sizing:border-box;display:flex;gap:4mm;align-items:center;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#000}
.stk .q{flex:none;width:40mm;height:40mm}
.stk .q svg{width:100%;height:100%;display:block}
.stk .t{flex:1;min-width:0;line-height:1.15}
.stk .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk,.stk *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.stk .band{background:#000;color:#fff;font-size:14pt;font-weight:900;padding:.6mm 2.5mm;letter-spacing:.6px;display:inline-block}
.stk .it{font-size:13pt;font-weight:700;margin-top:1mm}
.stk .sm{font-size:11pt;margin-top:.5mm}
.stk .inv{font-size:20pt;font-weight:900;letter-spacing:.1px;margin-top:1.5mm}
.stk .t div.nm{white-space:normal;font-size:15pt;font-weight:900;line-height:1.1;max-height:2.3em;overflow:hidden;word-break:break-word;margin-top:1mm}
.stk .t div.nm.s{font-size:13pt}
.stk .t div.nm.xs{font-size:11pt}
.pg5{display:block;width:148mm;height:209mm;overflow:hidden;page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid}
.pg5:last-child{page-break-after:auto;break-after:auto}
.hf{width:148mm;height:104mm;display:flex;align-items:center;justify-content:center;box-sizing:border-box;overflow:hidden}
.hf.top{border-bottom:.3mm dashed #888}
.cell{width:140mm;height:70mm;overflow:hidden}
.cell .stk{transform:scale(1.4);transform-origin:0 0}
.more{display:none;width:100%;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.more.on{display:flex}
.pdoc{padding:0;font-family:Arial,Helvetica,sans-serif}
.pdoc h2{font-size:15pt;margin:0 0 4px}
.ptab{width:100%;border-collapse:collapse;font-size:10.5pt;margin-top:8px}
.ptab th,.ptab td{border:1px solid #000;padding:5px;text-align:left;vertical-align:top}
.ptab .sigcell{width:30mm}
.psign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10mm;margin-top:16mm;font-size:10pt}
.psign div{border-top:1px solid #000;padding-top:4px}
.rem{margin-top:4px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px}
</style>
</head>
<body>
<div id="busybar"></div>

<div id="login" hidden>
  <div class="logo"><i class="e">e</i><i class="d">d</i><i class="y">y</i><i class="s">s</i></div>
  <h1>Christmas Pre-order Pickup Desk 🎄</h1>
  <div class="card">
    <form id="lf">
      <label id="srvBox">Server link (web app link ending in /exec)<input id="lSrv" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label>Name<input id="lName" autocomplete="username" autocapitalize="words" required></label>
      <label>PIN<input id="lPin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
      <label class="chkl rem"><input type="checkbox" id="lRem"> Remember me on this device (own phone / warehouse phone)</label>
      <div class="err" id="lErr"></div>
      <button class="btn pri big" id="lBtn">Log in</button>
    </form>
  </div>
  <div class="ver">App <span id="appVer"></span> · Server <span id="srvVer">…</span></div>
  <div class="alert" id="verWarn" hidden>App and server versions differ. Reload the page; if it stays, redeploy the web app.</div>
</div>

<div id="app" hidden>
  <header>
    <div class="logo"><i class="e">e</i><i class="d">d</i><i class="y">y</i><i class="s">s</i></div>
    <div class="sub">Xmas Pickup Desk</div>
    <div class="who" id="who"></div>
    <button class="btn" data-act="fullRefresh" title="Reload all data">⟳<span class="tx"> Refresh</span></button>
    <button class="btn" data-act="logout" title="Log out">⏻<span class="tx"> Log out</span></button>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>
  <button id="fab" data-act="scan" aria-label="Scan QR code"><span class="ic">📷</span>Scan</button>
</div>

<div id="scanner" hidden>
  <div class="top"><b id="scTitle">Scan QR code</b><span id="scCount" hidden></span><button class="btn sm" data-act="scanClose">✕ Done</button></div>
  <div class="vw"><video id="scVideo" playsinline muted autoplay></video><div class="frame" id="scFrame"></div></div>
  <div class="bot">
    <div id="scLast"></div>
    <div id="scStatus"></div>
    <button class="btn pri big" id="scPhoto" data-act="scanPhoto">📷 Take photo of QR</button>
    <div id="scPhoneApp"></div>
    <div class="tools"><button class="btn" id="scTorch" data-act="scanTorch" hidden>🔦 Light</button><button class="btn" id="scUsePhoto" data-act="scanPhoto" hidden>Use photo instead</button></div>
  </div>
  <input type="file" id="scFile" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" capture="environment" class="vh">
</div>

<div id="modal" hidden><div class="sheet"><button class="x" data-act="closeModal" aria-label="Close">×</button><div id="modalBody"></div></div></div>
<div id="toast"></div>
<div id="print"></div>

<script>
var APP_VERSION = '2026-10-31.3';

var API_URL = "https://script.google.com/macros/s/AKfycbzEMT5jpgsnmXqNz17ozboYFCLZmPm9LYz6yzkstDLP9FbCevl_pkQmDJgtPgS734H47Q/exec";
var PERMS = {
  book: ['Admin', 'Manager', 'Sales'],
  call: ['Admin', 'Manager', 'Sales', 'Counter'],
  tag: ['Admin', 'Manager', 'Warehouse', 'Counter'],
  dispatch: ['Admin', 'Manager', 'Warehouse'],
  receive: ['Admin', 'Manager', 'Counter'],
  cashier: ['Admin', 'Manager', 'Cashier'],
  handover: ['Admin', 'Manager', 'Counter'],
  manage: ['Admin', 'Manager'],
  admin: ['Admin']
};
var VIEWS = [
  { id: 'today', label: 'Today', perm: null },
  { id: 'new', label: '+ New order', perm: 'book' },
  { id: 'orders', label: 'All orders', perm: null },
  { id: 'calls', label: 'Calls', perm: 'call' },
  { id: 'warehouse', label: 'Warehouse', perm: 'dispatch' },
  { id: 'receive', label: 'Showroom receive', perm: 'receive' },
  { id: 'counter', label: 'Pickup counter', perm: 'handover' },
  { id: 'cashier', label: 'Cashier', perm: 'cashier' },
  { id: 'trees', label: 'Trees', perm: null },

  var n = $('lName').value.trim(), p = $('lPin').value.trim();
  if (!n || !p) return;
  $('lErr').textContent = '';
  if (!GAS && !API_URL) {
    var su = $('lSrv').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(su)) { $('lErr').textContent = 'Paste the web app link ending in /exec.'; return; }
    try { localStorage.setItem('xapi', su); } catch (e2) {}
    if (S.ver) S.ver();
  }
  $('lBtn').disabled = true;
  $('lBtn').textContent = '⏳ Logging in…';
  rpc('login', [n, p, true]).then(function (r) {
    $('lBtn').disabled = false; $('lBtn').textContent = 'Log in';
    $('lPin').value = '';
    S.token = r.token;
    store('xtok', r.token, $('lRem').checked);
    if (r.data) startApp(r.data); else boot();
  }, function (err) {
    $('lBtn').textContent = 'Log in';
    $('lBtn').disabled = false;
    $('lErr').textContent = err.message;
  });
}
function boot() {
  setBusy(true);
  call('bootstrap').then(function (r) {
    setBusy(false);
    startApp(r);
  }, function (e) { setBusy(false); store('xtok', null); showLogin(e.message.indexOf('expired') >= 0 ? '' : e.message); });
}
function startApp(r) {
    S.user = r.user; S.settings = r.settings; S.catalog = r.catalog; S.orders = unpack(r.orders); S.since = r.now; S.fullAt = Date.now();
    $('login').hidden = true; $('app').hidden = false;
    $('who').textContent = r.user.name + ' · ' + r.user.role;
    var def = { Counter: 'counter', Cashier: 'cashier', Warehouse: 'warehouse' }[r.user.role] || 'today';
    go(def);
    if (S.deep) { var d = S.deep; S.deep = null; openDeep(d); }
    setTimeout(function () { if (!detector()) loadJsQR().catch(function () {}); }, 1500);
}

function openDeep(no) {
  var o = findO(no);
  if (!o) return toast('Order ' + no + ' not found', true);
  if (!isActive(o)) { showDeadQr(o); return; }
  if (S.user.role === 'Counter' && isActive(o)) { S.counterNo = o.OrderNo; go('counter'); return; }
  if (S.user.role === 'Cashier' && isActive(o) && o.Balance > 0) { go('cashier'); payForm(o.OrderNo); return; }
  openOrder(o.OrderNo);
}
function logout(expired) {
  var t = S.token;
  store('xtok', null);
  S.token = null; S.user = null; S.orders = [];
  clearInterval(S.timer);
  closeModal();
  scanStop();
  if (t && !expired) rpc('logout', [t]).catch(function () {});
  showLogin(expired ? 'Session expired. Please log in again.' : '');
}



function navCounts() {
  var A = S.orders.filter(isActive);
  return {
    calls: A.filter(function (o) { return callDue(o) || needsDate(o); }).length,
    warehouse: A.filter(function (o) { return needsMove(o, transferDays()); }).length,
    receive: A.filter(function (o) { return o.Status === 'In transit'; }).length,
    cashier: A.filter(function (o) { return o.AtCashier && o.Balance > 0; }).length
  };
}
function renderNav() {
  if (!S.user) return;
  var c = navCounts();
  $('nav').innerHTML = VIEWS.filter(function (v) { return !v.perm || can(v.perm); }).map(function (v) {
    return '<button class="' + (S.view === v.id ? 'on' : '') + '" data-go="' + v.id + '">' + v.label + (c[v.id] ? ' <span class="cnt">' + c[v.id] + '</span>' : '') + '</button>';
  }).join('');
}
function go(v) {
  var def = VIEWS.filter(function (x) { return x.id === v; })[0];
  if (!def || (def.perm && !can(def.perm))) v = 'today';
  if (v !== S.view) S.sel = {};
  S.view = v;
  clearInterval(S.timer);
  renderNav();
  render();
  window.scrollTo(0, 0);
  S.timer = setInterval(autoRefresh, (v === 'cashier' || v === 'counter') ? 5000 : 20000);
}
function render() { var fn = window['v_' + S.view]; if (fn) fn(); }

function autoRefresh() {
  if (document.hidden || S.busy || !S.token) return;
  var full = Date.now() - S.fullAt > 600000;
  call('refresh', full ? {} : { since: S.since }).then(function (r) {
    var list = unpack(r.orders);
    if (r.full) { S.orders = list; S.fullAt = Date.now(); } else merge(list);
    if (r.removed && dropRemoved(r.removed)) { renderNav(); if (S.view !== 'new' && $('modal').hidden) render(); }
    S.since = r.now; if (r.catalog) S.catalog = r.catalog;
    renderNav();
    if (!list.length && !r.full) return;
    if (S.view === 'counter') { counterUpdate(); if (!S.counterNo) { renderCounterToday(); counterSearch(true); } return; }
    if (!$('modal').hidden) return;
    var a = document.activeElement;
    if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    if (S.view === 'new' || S.view === 'trees' || S.view === 'users') return;
    render();
  }, function () {});
}
function fullRefresh() {
  setBusy(true);
  call('refresh', {}).then(function (r) {
    setBusy(false);
    S.orders = unpack(r.orders); S.catalog = r.catalog; S.since = r.now; S.fullAt = Date.now();
    renderNav(); render(); toast('Updated');
  }, function (e) { setBusy(false); toast(e.message, true); });
}



function statusBadge(o) {
  var m = { 'Booked': '', 'Tagged': 'blue', 'In transit': 'amber', 'At showroom': 'green', 'Collected': 'dark', 'Cancelled': 'red' };
  var t = o.Status;
  if (o.Status === 'Booked') t = o.StockAt === 'Showroom' ? 'To tag · Showroom' : 'Waiting for stock';
  if (o.Status === 'Tagged') t = 'Tagged · Warehouse';
  var x = '';
  if (needsDate(o)) x = holdFlag(o) ? ' <span class="pill red">⚑ Not reachable</span>' : ' <span class="pill amber">Set pickup date</span>';
  return '<span class="pill ' + (m[o.Status] || '') + '">' + esc(t) + '</span>' + x;
}
function payBadge(o) {
  if (o.Status === 'Cancelled') return '';
  if (o.Balance > 0) return '<span class="pill red">Due ' + money(o.Balance) + (o.AtCashier ? ' · at cashier' : '') + '</span>';
  return '<span class="pill green">Paid</span>';
}

function grpOf(o) {
  if (!o.GroupNo) return [o];
  return S.orders.filter(function (x) { return x.GroupNo === o.GroupNo; }).sort(function (a, b) { return a.OrderNo < b.OrderNo ? -1 : 1; });
}
function gPicked(o) { var v = S.gPick[o.OrderNo]; return v === undefined ? o.Status === 'At showroom' : v; }
function orderRow(o, opt) {
  opt = opt || {};
  var hot = opt.hot ? ' hot' : '';
  return '<div class="row' + hot + '" data-no="' + esc(o.OrderNo) + '"' + (opt.act ? ' data-act="' + opt.act + '"' : '') + '>' +
    (opt.check ? '<input type="checkbox" class="chk" value="' + esc(o.OrderNo) + '"' + (S.sel[o.OrderNo] ? ' checked' : '') + '>' : '') +
    '<div class="main"><div class="l1"><b>' + esc(o.OrderNo) + '</b> ' + esc(o.Customer) + ' <span class="muted">' + esc(o.Phone) + (o.InvoiceNo ? ' · Inv ' + esc(o.InvoiceNo) : '') + '</span></div>' +
    '<div class="l2">' + esc(o.Item) + qtyTxt(o) + (o.Part ? ' · tree ' + esc(o.Part) : '') + ' · ' + dateLabel(o.PickupDate) + '</div>' +
    (opt.sub ? '<div class="l3">' + esc(opt.sub) + '</div>' : '') + '</div>' +
    '<div class="tags">' + statusBadge(o) + payBadge(o) + '</div>' + (opt.extra || '') + '</div>';
}
function rows(list, opt, empty) { return list.length ? list.map(function (o) { return orderRow(o, typeof opt === 'function' ? opt(o) : opt); }).join('') : '<p class="muted">' + (empty || 'Nothing here.') + '</p>'; }
function canTagLoc(o) { return o.StockAt === 'Showroom' ? ['Admin', 'Manager', 'Counter'].indexOf(S.user.role) >= 0 : ['Admin', 'Manager', 'Warehouse'].indexOf(S.user.role) >= 0; }
function locText(o) {
  if (o.Status === 'In transit') return 'on the way from warehouse (' + o.DispatchNo + ')';
  if (o.Status === 'Tagged') return 'still in the warehouse (tagged)';
  if (o.Status === 'Booked') return o.StockAt === 'Showroom' ? 'showroom stock, not tagged yet' : 'waiting for stock (no tree tagged yet)';
  return o.Status;
}



document.addEventListener('click', function (e) {
  var g = e.target.closest('[data-go]');
  if (g) { go(g.getAttribute('data-go')); return; }
  var bt = e.target.closest('button');
  if (bt) S.lastBtn = bt;
  var a = e.target.closest('[data-act]');
  if (a && !e.target.closest('input[type=checkbox]')) {
    var fn = ACT[a.getAttribute('data-act')];
    if (fn) { e.preventDefault(); fn(a.getAttribute('data-no'), a); }
    return;
  }
  var r = e.target.closest('.row[data-no]');
  if (r && !e.target.closest('input,a,button,label,select')) openOrder(r.getAttribute('data-no'));
});
document.addEventListener('submit', function (e) { var b = e.target.querySelector('button.pri, button.danger, button:not([type=button])'); if (b) S.lastBtn = b; }, true);

document.addEventListener('visibilitychange', function () { if (!document.hidden && S.token && S.user) autoRefresh(); });
document.addEventListener('change', function (e) {
  if (e.target.classList && e.target.classList.contains('gp')) { S.gPick[e.target.value] = e.target.checked; counterUpdate(); return; }
  if (e.target.classList && e.target.classList.contains('chk')) { S.sel[e.target.value] = e.target.checked; syncSel(); }
});

function syncSel() {
  document.querySelectorAll('.chk').forEach(function (c) { c.checked = !!S.sel[c.value]; });
  document.querySelectorAll('.selc').forEach(function (s) { s.textContent = selectedIn(s.getAttribute('data-list')).length; });
}
function selectedIn(listId) {
  var box = $(listId);
  if (!box) return [];
  return Array.prototype.slice.call(box.querySelectorAll('.chk')).filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
}
function selAll(listId) {
  var cs = Array.prototype.slice.call($(listId).querySelectorAll('.chk'));
  var all = cs.every(function (c) { return c.checked; });
  cs.forEach(function (c) { S.sel[c.value] = !all; });
  syncSel();
}



function showModal(html, kind, no) { $('modalBody').innerHTML = html; $('modal').hidden = false; S.modalKind = kind || 'form'; S.modalNo = no || null; }
function closeModal() { $('modal').hidden = true; S.modalKind = null; S.modalNo = null; }
function backOrClose(fromOrder, no) { if (fromOrder) openOrder(no); else closeModal(); }

function openOrder(no) {
  var o = findO(no);
  if (!o) return;
  showModal(orderHtml(o), 'order', o.OrderNo);
  S.hist = S.hist || {};
  if (S.hist[o.OrderNo]) $('hist').innerHTML = S.hist[o.OrderNo];
  call('history', { orderNo: o.OrderNo }).then(function (r) {
    var html = r.items.length ? r.items.map(function (i) {
      return '<div class="hi"><span class="muted">' + esc(i.t) + '</span> <b>' + esc(i.a) + '</b> · ' + esc(i.u) + (i.d ? ' - ' + esc(i.d) : '') + '</div>';
    }).join('') : '<div class="muted">No history yet.</div>';
    S.hist[o.OrderNo] = html;
    var h = $('hist');
    if (h && S.modalNo === o.OrderNo) h.innerHTML = html;
  }, function () {});
}
function kv(label, val) { return val === '' || val == null ? '' : '<dt>' + esc(label) + '</dt><dd>' + val + '</dd>'; }
function orderHtml(o) {

  }
  if (isActive(o) && can('manage')) { btn('edit', 'Edit', '', m); btn('cancel', 'Cancel order', 'danger', m); }

  if (can('admin')) btn('del', '🗑 Delete order', 'danger', m);

  return '<h3>' + esc(o.OrderNo) + ' · ' + esc(o.Customer) + '</h3>' +
    '<div style="margin-bottom:10px">' + statusBadge(o) + ' ' + payBadge(o) + (o.PickupDate && o.ConfirmedFor === o.PickupDate && isActive(o) ? ' <span class="pill green">Pickup confirmed</span>' : '') + '</div>' +

    kv('Phone', '<a href="tel:' + esc(o.Phone) + '">' + esc(o.Phone) + '</a>' + (o.Phone2 ? ' / <a href="tel:' + esc(o.Phone2) + '">' + esc(o.Phone2) + '</a>' : '')) +

    (o.BalancePaid ? kv('Balance paid', money(o.BalancePaid) + ' · ' + esc(o.BalanceMethod) + (o.BalanceRef ? ' #' + esc(o.BalanceRef) : '') + ' · ' + esc(o.BalancePaidAt) + ' by ' + esc(o.BalancePaidBy)) : '') +
    kv('Balance due', o.Balance > 0 ? '<b style="color:var(--r)">' + money(o.Balance) + '</b>' : 'Nothing') +

    kv('Call note', esc(o.CallNote)) +
    kv('Collected', o.CollectedAt ? esc(o.CollectedAt + ' · by ' + o.CollectedName + ' · staff ' + o.CollectedBy) + sigLink : '') +
    kv('Notes', esc(o.Notes)) +
    kv('Cancelled', esc(o.CancelReason)) +

    (b.length ? '<div class="acts">' + b.join('') + '</div>' : '') + '<h3 style="margin-top:16px">History</h3><div id="hist" class="muted">Loading…</div>';
}

function dayLoad(d) {
  if (!d) return '';
  var n = S.orders.filter(function (o) { return isActive(o) && o.PickupDate === d; }).reduce(function (s, o) { return s + o.Qty; }, 0);
  return fmtD(d) + ' · ' + n + ' tree(s) already booked for this day';

    '<div class="paybox"><div><b>' + esc(o.Customer) + '</b> · ' + esc(o.Item) + qtyTxt(o) + '</div>' +

    '<div class="bigamt">' + money(o.Balance) + '</div></div>' +
    '<form id="mf"><div class="grid2"><label>Method<select id="pM">' + payMethods().map(function (m) { return '<option>' + esc(m) + '</option>'; }).join('') + '</select></label>' +

function v_today() {

function nLines() {

  Array.prototype.forEach.call(document.querySelectorAll('#nMore .xrow'), function (row) {

    if (x) out.push({ SKU: x.value, Qty: Math.max(1, Math.floor(Number(row.querySelector('.xQty').value) || 1)) }); else incomplete = true;
  });

function nSummary() {
  $('nDateInfo').textContent = dayLoad($('nDate').value);
  var L = nLines();
  if (!L.list.length) { $('nSum').innerHTML = 'Select a tree to see the total.'; return; }
  var pct = Math.max(0, Number($('nDisc').value) || 0), adv = Math.max(0, Number($('nAdv').value) || 0);
  if (pct >= 100) { $('nSum').innerHTML = '<span style="color:var(--r)">Discount must be less than 100 %.</span>'; return; }
  var all = 0, rows = L.list.map(function (l) {
    var c = S.catalog.filter(function (x) { return x.SKU === l.SKU; })[0];
    var sub = c.Price * l.Qty, disc = calcDisc(sub, pct), total = sub - disc;
    all += total;
    return '<div><b>' + esc(c.Label) + '</b> · ' + money(c.Price) + (l.Qty > 1 ? ' × ' + l.Qty + ' = ' + money(sub) : '') + (disc ? ' − ' + pct + '% = ' + money(disc) : '') + (L.list.length > 1 ? ' → ' + money(total) : '') + '</div>';
  }).join('');
  var bal = all - adv;
  $('nSum').innerHTML = rows + (L.incomplete && L.list.length ? '<div style="color:var(--r)">One tree above has no size selected yet.</div>' : '') +
    '<div>' + (L.list.length > 1 ? L.list.length + ' trees · ' : '') + 'Total <b>' + money(all) + '</b> · Advance ' + money(adv) + '</div>' +
    '<div class="bal" style="color:' + (bal < 0 ? 'var(--r)' : 'inherit') + '">' + (bal < 0 ? 'Advance is more than the total!' : 'Balance at pickup: ' + money(bal)) + '</div>' +
    (L.list.length > 1 ? '<small class="muted">The advance is shared over the trees in proportion to their prices.</small>' : '');
}

function initSig() {
  var c = $('sig');
  if (!c) return;
  var r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  var w = Math.max(r.width, 300), h = Math.max(r.height, 150);
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  var x = c.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
  x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#111';
  S.sigInk = false;
  var drawing = false, last = null;
  function pos(e) { var b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
  c.onpointerdown = function (e) { drawing = true; last = pos(e); try { c.setPointerCapture(e.pointerId); } catch (er) {} e.preventDefault(); };
  c.onpointermove = function (e) {
    if (!drawing) return;
    var p = pos(e);
    x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(p.x, p.y); x.stroke();
    last = p;
    if (!S.sigInk) { S.sigInk = true; counterReady(); }
  };
  c.onpointerup = c.onpointercancel = function () { drawing = false; };
}

function sigData() {
  var c = $('sig');

    var w = Math.min(600, c.width), h = Math.round(c.height * w / c.width);
    var t = document.createElement('canvas'); t.width = w; t.height = h;
    var x = t.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(c, 0, 0, w, h);
    return t.toDataURL('image/png');
  } catch (e) { return c.toDataURL('image/png'); }
}

    var pages = [];
    for (var i = 0; i < list.length; i += 2) {
      var h = function (x, c) { return '<div class="hf ' + c + '">' + (x ? '<div class="cell">' + x + '</div>' : '') + '</div>'; };
      pages.push('<div class="pg5">' + h(list[i], 'top') + h(list[i + 1], 'bot') + '</div>');
    }
    doPrint(pages.join(''), false, 'a5');
  } else doPrint(list.map(function (x) { return '<div class="pg">' + x + '</div>'; }).join(''));
}
function tagModeSel() {
  return '<label class="muted" style="font-size:13px">Tag print: <select onchange="setTagMode(this.value)"><option value="a5"' + (tagMode() === 'a5' ? ' selected' : '') + '>A5 sheet, 2 tags per page</option><option value="roll"' + (tagMode() === 'roll' ? ' selected' : '') + '>Sticker roll 10 × 5 cm</option></select></label>';
}
function printTags(list) { printStickers(list.filter(Boolean).map(stickerTag)); }
function printDispatch(dno, list, note) {
  list = list.slice().sort(byDate);
  var n = list.reduce(function (s, o) { return s + o.Qty; }, 0);
  doPrint('<div class="pdoc"><h2>' + esc(S.settings.ShopName) + ' · Warehouse → Showroom dispatch ' + esc(dno) + '</h2>' +
    '<div>' + esc(new Date().toLocaleString('en-GB')) + ' · by ' + esc(S.user.name) + (note ? ' · ' + esc(note) : '') + ' · <b>' + n + ' tree(s)</b></div>' +
    '<table class="ptab"><tr><th>#</th><th>Tag</th><th>Tree</th><th>Qty</th><th>Customer</th><th>Pickup</th><th>Received ✓</th></tr>' +
    list.map(function (o, i) { return '<tr><td>' + (i + 1) + '</td><td><b>' + esc(o.OrderNo) + '</b></td><td>' + esc(o.Item) + '</td><td>' + o.Qty + '</td><td>' + esc(o.Customer) + '</td><td>' + esc(fmtD(o.PickupDate)) + '</td><td></td></tr>'; }).join('') +
    '</table><div class="psign"><div>Loaded by</div><div>Driver</div><div>Received at showroom by</div></div></div>', true);
}
function printDay(d) {
  var list = S.orders.filter(function (o) { return isActive(o) && o.PickupDate === d; }).sort(byDate);
  doPrint('<div class="pdoc"><h2>' + esc(S.settings.ShopName) + ' · Christmas tree pickups ' + esc(fmtD(d)) + ' (' + esc(d) + ')</h2>' +
    '<div>' + list.length + ' order(s) not yet collected · printed ' + esc(new Date().toLocaleString('en-GB')) + '. Backup only: record handovers in the app.</div>' +
    '<table class="ptab"><tr><th>Tag</th><th>Invoice</th><th>Customer</th><th>Phone</th><th>Tree</th><th>Where</th><th>Balance</th><th class="sigcell">Signature</th></tr>' +
    list.map(function (o) {
      return '<tr><td><b>' + esc(o.OrderNo) + '</b></td><td>' + esc(o.InvoiceNo) + '</td><td>' + esc(o.Customer) + '</td><td>' + esc(o.Phone) + '</td><td>' + esc(o.Item) + qtyTxt(o) + '</td><td>' + esc(o.Status === 'At showroom' ? 'Showroom' : o.Status) + '</td><td>' + (o.Balance > 0 ? money(o.Balance) : 'Paid') + '</td><td></td></tr>';
    }).join('') + '</table></div>', true);
}
</script>
